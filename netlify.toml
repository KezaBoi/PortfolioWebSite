[build]
  command = "npm run build"
  publish = "dist" 

# --- Security Headers ---
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    # Optional: Strict Transport Security (HSTS) - Uncomment if you have a custom domain with SSL
    # Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# --- Caching Strategies ---
# Cache immutable assets (Vite hashes filenames, so these can be cached forever)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache standard static files
[[headers]]
  for = "*.{js,css,jpg,jpeg,png,gif,ico,svg,webp,woff,woff2}"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# --- Redirects ---

# Short link for Resume
# IMPORTANT: Ensure 'resume.pdf' is inside your 'public/' folder!
[[redirects]]
  from = "/resume"
  to = "/resume.pdf"
  status = 301

[[redirects]]
  from = "/cv"
  to = "/resume.pdf"
  status = 301

# SPA Fallback (Essential for React Router)
# This sends all unknown routes to index.html so React can handle the routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200